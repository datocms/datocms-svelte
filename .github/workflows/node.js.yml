# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'development']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # `.npmrc` sets engine-strict, and `@changesets/cli` requires Node 22
        # or later — so `npm ci` cannot succeed on anything older here, and a
        # matrix job on 18 or 20 would be claiming a compatibility nobody can
        # actually install into. Both are also past end-of-life.
        # See the supported release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
